name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Check types and Svelte
        run: bun run check

      - name: Run unit tests
        run: bun run test

      - name: Build Cloudflare artifact
        run: bun run build

      - name: Audit dependencies
        run: bun run security:audit
